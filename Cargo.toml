[package]
name = "cfst"
version = "2.4.0"
edition = "2021"
description = "CloudflareSpeedTest - Test latency and speed of Cloudflare CDN IPs"
license = "GPL-3.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "trust-dns"] }
indicatif = "0.17"
colored = "2"
csv = "1"
ipnetwork = "0.20"
regex = "1"
rand = "0.8"
futures = "0.3"
