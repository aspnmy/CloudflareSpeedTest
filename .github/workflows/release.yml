name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cfst
            archive: tar.gz
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: cfst
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            bin: cfst
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: cfst
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            bin: cfst
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            bin: cfst
            archive: tar.gz
            cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            bin: cfst
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: cfst
            archive: tar.gz
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cfst
            archive: tar.gz
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cfst.exe
            archive: zip
            cross: false
          - os: windows-latest
            target: i686-pc-windows-msvc
            bin: cfst.exe
            archive: zip
            cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md dist/ 2>/dev/null || true
          cp LICENSE dist/ 2>/dev/null || true

      - name: Create tar.gz archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd dist
          tar -czf ../cfst_${{ github.ref_name }}_${{ matrix.target }}.tar.gz .
          cd ..
          ls -la cfst_${{ github.ref_name }}_${{ matrix.target }}.tar.gz

      - name: Create zip archive
        if: matrix.archive == 'zip'
        run: |
          Compress-Archive -Path dist\* -DestinationPath cfst_${{ github.ref_name }}_${{ matrix.target }}.zip
          Get-Item cfst_${{ github.ref_name }}_${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfst_${{ github.ref_name }}_${{ matrix.target }}
          path: cfst_${{ github.ref_name }}_${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: false
